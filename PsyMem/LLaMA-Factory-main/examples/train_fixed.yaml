# 模型设置
model_name_or_path: /home/capios/models/Qwen/Qwen2-7B-Instruct
template: qwen

# 训练方法
stage: sft
do_train: true
finetuning_type: lora  # 使用 LoRA 而不是全参数微调，更节省内存

# 数据设置
dataset:
  - data_sharegpt.json # 你的数据集文件名
  - type: sharegpt # 明确指定为 sharegpt 格式
  - split: train
dataset_dir: /home/capios/inter/interactive-agents-main/LLaMA-Factory-main/data  # 指定数据集所在目录

# 训练超参数
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 2e-4 
num_train_epochs: 2
lr_scheduler_type: cosine
save_steps: 200
logging_steps: 10
eval_steps: 200

# 输出设置
output_dir: ../outputs/psy_sft_fixed
overwrite_output_dir: false  # 支持续训

# LoRA 设置
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.1

# 系统设置
fp16: true
ddp_find_unused_parameters: false
do_eval: false



 # 禁用评估CUDA_VISIBLE_DEVICES=0 llamafactory-cli train examples/train_fixed.yaml